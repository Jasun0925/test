version: '3.8'

services:
  mysql:
    image: mysql:8
    container_name: greeting-mysql
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: greeting_db
      MYSQL_USER: greeting_user
      MYSQL_PASSWORD: greeting_pass
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql

  redis:
    image: redis:7
    container_name: greeting-redis
    ports:
      - "6379:6379"

volumes:
  mysql-data:
