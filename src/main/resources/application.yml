spring:
  datasource:
    url: jdbc:mysql://localhost:3306/greeting_db
    username: greeting_user
    password: greeting_pass
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        type:
          preferred_uuid_jdbc_type: VARCHAR
  flyway:
    enabled: true
